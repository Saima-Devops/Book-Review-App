- name: Prepare or deploy Reading Room only when invoked by the operator
  hosts: all
  become: true
  gather_facts: false
  vars:
    app_dir: "{{ lookup('env', 'APP_DIR') }}"
    app_repo: "{{ lookup('env', 'APP_REPO') }}"
    app_ref: "{{ lookup('env', 'APP_REF') }}"
  pre_tasks:
    - name: Wait for SSH
      tags: [always]
      ansible.builtin.wait_for_connection:
        timeout: 600
    - name: Gather host facts
      tags: [always]
      ansible.builtin.setup:
  tasks:
    - name: Prepare the host and checkout the existing repository
      tags: [prepare]
      block:
        - name: Install host prerequisites
          ansible.builtin.apt:
            name: [ca-certificates, curl, git, python3]
            state: present
            update_cache: true
        - name: Install official AWS CLI v2 only for Secrets Manager deployments
          when: lookup('env', 'SECRET_SOURCE') == 'aws'
          block:
            - name: Install AWS CLI installer prerequisites
              ansible.builtin.apt:
                name: [unzip, gnupg, groff, less]
                state: present
            - name: Download AWS's official CLI installer
              ansible.builtin.get_url:
                url: https://awscli.amazonaws.com/v2/install.sh
                dest: /var/tmp/reading-room-aws-cli-install.sh
                owner: root
                group: root
                mode: '0700'
            - name: Install AWS CLI system-wide using its verified installer
              ansible.builtin.command:
                cmd: bash /var/tmp/reading-room-aws-cli-install.sh --system
                creates: /usr/local/bin/aws
        - name: Create Docker keyring directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'
        - name: Download Docker repository signing key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: '0644'
        - name: Configure Docker's Ubuntu repository
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable"
            filename: docker
            state: present
        - name: Install Docker Engine and Compose
          ansible.builtin.apt:
            name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
            state: present
            update_cache: true
        - name: Enable Docker service
          ansible.builtin.service:
            name: docker
            state: started
            enabled: true
        - name: Allow ubuntu to operate Docker
          ansible.builtin.user:
            name: ubuntu
            groups: docker
            append: true
        - name: Create deployment directory
          ansible.builtin.file:
            path: "{{ app_dir }}"
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: '0755'
        - name: Checkout the operator's exact pushed commit
          become_user: ubuntu
          ansible.builtin.git:
            repo: "{{ app_repo }}"
            dest: "{{ app_dir }}"
            version: "{{ app_ref }}"
            update: true
            force: false
            accept_hostkey: false
            key_file: "{{ lookup('env', 'GITHUB_DEPLOY_KEY') | default(omit, true) }}"
        - name: Create protected backup directory
          ansible.builtin.file:
            path: "{{ app_dir }}/backups"
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: '0700'
        - name: Create proxy log directory for non-root Nginx
          ansible.builtin.file:
            path: "{{ app_dir }}/logs/proxy"
            state: directory
            owner: '101'
            group: '101'
            mode: '0750'
        - name: Install host log rotation configuration
          ansible.builtin.template:
            src: proxy-logrotate.j2
            dest: /etc/logrotate.d/reading-room-proxy
            owner: root
            group: root
            mode: '0644'
        - name: Preparation instructions
          ansible.builtin.debug:
            msg: "Prepared {{ app_dir }}. Configure secrets on the VM, then run the separate configure phase."

    - name: Deploy the prepared checkout
      tags: [deploy]
      block:
        - name: Check prepared commit
          ansible.builtin.command:
            cmd: git rev-parse HEAD
            chdir: "{{ app_dir }}"
          register: checked_out_ref
          changed_when: false
        - name: Require the prepared commit to match deployment input
          ansible.builtin.assert:
            that: checked_out_ref.stdout == app_ref
            fail_msg: "Run the prepare phase for the chosen APP_REF before configuring."
        - name: Load Secrets Manager or refresh an existing local env file
          become_user: ubuntu
          ansible.builtin.command:
            cmd: python3 scripts/configure-env.py --non-interactive
            chdir: "{{ app_dir }}"
          environment:
            PUBLIC_URL: "{{ lookup('env', 'PUBLIC_URL') }}"
            APP_IMAGE_TAG: "{{ lookup('env', 'APP_IMAGE_TAG') }}"
            SECRET_SOURCE: "{{ lookup('env', 'SECRET_SOURCE') }}"
            SECRET_ARN: "{{ lookup('env', 'SECRET_ARN') }}"
            AWS_REGION: "{{ lookup('env', 'AWS_REGION') }}"
            DB_VOLUME_NAME: "{{ lookup('env', 'DB_VOLUME_NAME') }}"
          no_log: true
        - name: Validate Compose without exposing values
          ansible.builtin.command:
            cmd: docker compose config --quiet
            chdir: "{{ app_dir }}"
          changed_when: false
        - name: Build and start all services with readiness checks
          ansible.builtin.command:
            cmd: docker compose up -d --build --wait --wait-timeout 600
            chdir: "{{ app_dir }}"
          changed_when: true
        - name: Verify database-backed health through Nginx
          ansible.builtin.uri:
            url: http://127.0.0.1/health
            status_code: 200
        - name: Verify frontend through Nginx
          ansible.builtin.uri:
            url: "{{ lookup('env', 'PUBLIC_URL') if lookup('env', 'PUBLIC_URL').startswith('https://') else 'http://127.0.0.1/' }}"
            status_code: 200
        - name: Application URL
          ansible.builtin.debug:
            msg: "{{ lookup('env', 'PUBLIC_URL') }}"
