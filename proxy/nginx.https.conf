worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format access_json escape=json
        '{"time":"$time_iso8601","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"upstream_status":"$upstream_status"}';
    access_log /var/log/nginx/access.log access_json;

    upstream frontend_upstream {
        zone frontend_zone 64k;
        server frontend:3000 resolve;
    }
    upstream backend_upstream {
        zone backend_zone 64k;
        server backend:3001 resolve;
    }

    server {
        listen 8080;
        # Docker readiness checks must not follow a TLS redirect to localhost.
        location = /health {
            access_log off;
            proxy_pass http://backend_upstream/api/books;
        }
        location / { return 308 https://$host$request_uri; }
    }

    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;
        client_max_body_size 1m;
        # No HSTS: this assignment certificate intentionally expires without renewal.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =503 /unavailable;

        location = /unavailable {
            internal;
            default_type application/json;
            return 503 '{"message":"Service temporarily unavailable"}';
        }
        location = /health {
            access_log off;
            proxy_pass http://backend_upstream/api/books;
        }
        location /api/ { proxy_pass http://backend_upstream; }
        location /_next/static/ { proxy_pass http://frontend_upstream; }
        location /assets/ { proxy_pass http://frontend_upstream; }
        location / { proxy_pass http://frontend_upstream; }
    }
}
